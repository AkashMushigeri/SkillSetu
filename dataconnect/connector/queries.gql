query ListMyApplications
  @auth(expr: "auth.token.userRole == 'STUDENT'", insecureReason: "Students can view their applications.") {
  applications(where: { candidateUid: { eq_expr: "auth.uid" } }) {
    id
    company {
      id
      name
    }
    jobId
    internshipId
    title
    jobType
    matchScore
    appliedDate
    stage
    matchedSkills
    missingSkills
    interviewId
  }
}

query ListCompanyApplications($companyId: UUID!)
  @auth(expr: "auth.token.userRole == 'INDUSTRY'", insecureReason: "Industry users can view their company's applications.") {
  company(first: { where: { id: { eq: $companyId }, ownerUid: { eq_expr: "auth.uid" } } })
    @redact @check(expr: "this != null", message: "Company access denied") { id }
  applications(where: { companyId: { eq: $companyId } }) {
    id
    candidate {
      uid
      displayName
      email
      photoUrl
      college
      location
    }
    jobId
    internshipId
    title
    jobType
    matchScore
    appliedDate
    stage
    matchedSkills
    missingSkills
  }
}

