query ListMoUs
  @auth(expr: "auth.token.userRole == 'INDUSTRY'", insecureReason: "Industry users can list MoUs.") {
  collegeCompanies(where: { mouStatus: { eq: ACTIVE }, company: { ownerUid: { eq_expr: "auth.uid" } } }) {
    college {
      id
      name
      location
    }
    company {
      id
      name
      logo
    }
    studentsCount
    internshipsOffered
    studentsHired
    activePrograms
    industryChallengesActive
    mouStatus
    curriculumModules_on_collegeCompany {
      semester
      currentSubject
      industryRecommendation
      recommendedTechnologies
      rationale
      status
    }
  }
}

