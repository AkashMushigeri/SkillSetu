query ListCompanies @auth(level: PUBLIC, insecureReason: "Anyone can browse companies.") {
  companies {
    id
    name
    type
    industry
    location
    employees
    founded
    website
    tagline
    logo
    coverImage
  }
}

query GetCompany($id: UUID!) @auth(level: PUBLIC, insecureReason: "Anyone can view a company.") {
  company(id: $id) {
    id
    name
    type
    industry
    location
    coordinates
    employees
    founded
    website
    tagline
    about
    mission
    techStack
    departments
    hiringDomains
    benefits
    culture
    logo
    coverImage
    jobs_on_company {
      id
      title
      location
      workMode
      jobType
      salaryRange
      status
      postedDate
    }
    internships_on_company {
      id
      title
      location
      workMode
      duration
      stipend
      status
      postedDate
    }
  }
}

query GetMyCompany @auth(level: USER, insecureReason: "Company owners can find their own profile.") {
  companies(where: { ownerUid: { eq_expr: "auth.uid" } }, limit: 1) { id }
}

query GetMyCollege @auth(level: USER, insecureReason: "College owners can find their own profile.") {
  colleges(where: { ownerUid: { eq_expr: "auth.uid" } }, limit: 1) { id }
}

query GetMyEducation @auth(level: USER, insecureReason: "Students can read their own education rows.") {
  user(key: { uid_expr: "auth.uid" }) {
    candidateEducations_on_user {
      id
      profileOwnerUid
      degree
      department
      college
      graduationYear
      cgpa
      currentYear
      createdAt
    }
  }
}

query ListColleges @auth(level: PUBLIC, insecureReason: "Anyone can browse colleges.") {
  colleges {
    id
    name
    location
    studentsCount
    verifiedStudentsCount
    placementReadiness
    partnershipStatus
    contactPerson
    contactEmail
  }
}

query GetMyProfile @auth(level: USER_EMAIL_VERIFIED, insecureReason: "Verified users can view their profile.") {
  user(key: { uid_expr: "auth.uid" }) {
    uid
    displayName
    email
    photoUrl
    role
    college
    location
    phone
    candidateSkills: userSkills_on_user {
      level
      verified
      score
      skill {
        name
        category
      }
    }
    candidateProjects_on_user {
      id
      title
      description
      technologies
      githubUrl
      liveUrl
      createdAt
    }
    candidateExperiences_on_user {
      id
      title
      company
      duration
      description
      location
      startDate
      endDate
    }
    candidateEducations_on_user {
      id
      profileOwnerUid
      degree
      department
      college
      graduationYear
      cgpa
      currentYear
      createdAt
    }
  }
}

query SearchCandidates($skillNames: [String!])
  @auth(expr: "auth.token.userRole == 'INDUSTRY'", insecureReason: "Industry recruiters can search candidates by skills.") {
  candidates: users(
    where: { role: { eq: STUDENT } }
    limit: 50
  ) {
    uid
    displayName
    email
    photoUrl
    college
    location
    filteredSkills: userSkills_on_user(where: { skill: { name: { in: $skillNames } } }) {
      level
      verified
      score
      skill {
        name
      }
    }
    candidateProjects_on_user {
      title
      description
      technologies
      githubUrl
      liveUrl
    }
    candidateEducations_on_user {
      profileOwnerUid
      degree
      department
      college
      graduationYear
      cgpa
      currentYear
      createdAt
    }
  }
}

query GetCandidateProfile($uid: String!)
  @auth(expr: "auth.token.userRole in ['INDUSTRY', 'COLLEGE']") {
  user(key: { uid: $uid }) @check(expr: "this != null && this.role == 'STUDENT'", message: "Candidate profile access denied") {
    uid
    displayName
    role
    email
    photoUrl
    college
    location
    phone
    candidateSkills: userSkills_on_user {
      level
      verified
      score
      verificationDate
      verifiedBy
      badgeUrl
      skill {
        name
        category
      }
    }
    candidateProjects_on_user {
      id
      title
      description
      technologies
      githubUrl
      liveUrl
      createdAt
    }
    candidateExperiences_on_user {
      id
      title
      company
      duration
      description
      location
      startDate
      endDate
    }
    candidateEducations_on_user {
      id
      profileOwnerUid
      degree
      department
      college
      graduationYear
      cgpa
      currentYear
      createdAt
    }
  }
}

query ListJobs @auth(level: PUBLIC, insecureReason: "Anyone can browse jobs.") {
  jobs {
    id
    title
    company {
      id
      name
      logo
      location
      coordinates
    }
    department
    location
    workMode
    jobType
    salaryRange
    experienceRequired
    minimumCgpa
    jobRequiredSkills_on_job {
      level
      importance
      minScore
      skill {
        name
      }
    }
    deadline
    openings
    applicationsCount
    status
    postedDate
  }
}

query ListInternships @auth(level: PUBLIC, insecureReason: "Anyone can browse internships.") {
  internships {
    id
    title
    company {
      id
      name
      logo
      location
      coordinates
    }
    department
    location
    workMode
    duration
    stipend
    eligibility
    startDate
    applicationDeadline
