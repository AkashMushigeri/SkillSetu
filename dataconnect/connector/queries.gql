query ListChallenges @auth(level: PUBLIC, insecureReason: "Anyone can browse challenges.") {
  challenges {
    id
    title
    description
    difficulty
    deadline
    teamSize
    prize
    participantsCount
    submissionsCount
    status
    company {
      id
      name
      logo
    }
    requiredSkills
    createdDate
  }
}

query GetChallenge($id: UUID!)
  @auth(level: PUBLIC, insecureReason: "Anyone can view a challenge.") {
  challenge(id: $id) {
    id
    title
    description
    problemStatement
    requiredSkills
    difficulty
    deadline
    teamSize
    prize
    submissionRequirements
    collegeParticipation
    participantsCount
    submissionsCount
    status
    company {
      id
      name
      logo
    }
    createdDate
    createdAt
  }
}

query ListChallengeSubmissions($challengeId: UUID!)
  @auth(expr: "auth.token.userRole == 'INDUSTRY'", insecureReason: "Recruiters can view submissions to their own challenges.") {
  challenge(id: $challengeId) @redact @check(expr: "this != null", message: "Challenge access denied") {
    company { ownerUid @check(expr: "this == auth.uid", message: "Challenge access denied") }
  }
  challengeSubmissions(where: { challengeId: { eq: $challengeId } }) {
    id
    teamName
    teamLeadUid
    college
    submissionDate
    githubUrl
    liveDemoUrl
    videoUrl
    score
    testPassRate
    aiSummary
    status
    skillsDemonstrated
  }
}

