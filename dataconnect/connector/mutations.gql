  candidateEducation_delete(first: { where: {
    id: { eq: $id },
    userUid: { eq_expr: "auth.uid" },
    profileOwnerUid: { isNull: true }
  } })
}

mutation CreateJob($companyId: UUID!, $title: String!, $department: String, $location: String, $workMode: String, $jobType: String, $salaryRange: String, $experienceRequired: String, $education: String, $graduationYear: String, $minimumCgpa: Float, $description: String, $responsibilities: [String!], $qualifications: [String!], $deadline: Timestamp, $openings: Int, $status: String)
  @auth(expr: "auth.token.email_verified && auth.token.userRole == 'INDUSTRY'") @transaction {
  query @redact {
    company(first: { where: { id: { eq: $companyId }, ownerUid: { eq_expr: "auth.uid" } } })
      @check(expr: "this != null", message: "Company access denied") { id }
  }
  job_insert(data: {
    companyId: $companyId,
    title: $title,
    department: $department,
    location: $location,
    workMode: $workMode,
    jobType: $jobType,
    salaryRange: $salaryRange,
    experienceRequired: $experienceRequired,
    education: $education,
    graduationYear: $graduationYear,
    minimumCgpa: $minimumCgpa,
    description: $description,
    responsibilities: $responsibilities,
    qualifications: $qualifications,
    deadline: $deadline,
    openings: $openings,
    status: $status
  })
}

mutation UpsertJobRequiredSkill($jobId: UUID!, $skillId: UUID!, $level: SkillLevel!, $importance: SkillImportance!, $minScore: Float)
  @auth(expr: "auth.token.email_verified && auth.token.userRole == 'INDUSTRY'") @transaction {
  query @redact {
    job(id: $jobId) @check(expr: "this != null", message: "Job access denied") {
      company { ownerUid @check(expr: "this == auth.uid", message: "Job access denied") }
    }
  }
  jobRequiredSkill_upsert(data: {
    jobId: $jobId,
    skillId: $skillId,
    level: $level,
    importance: $importance,
    minScore: $minScore
  })
}

