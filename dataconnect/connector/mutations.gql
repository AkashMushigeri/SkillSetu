mutation UpsertStudentProfile($displayName: String!, $email: String!, $photoUrl: String, $college: String, $location: String, $phone: String)
  @auth(expr: "auth.token.userRole == 'STUDENT'") {
  user_upsert(data: {
    uid_expr: "auth.uid",
    displayName: $displayName,
    email: $email,
    role: STUDENT,
    photoUrl: $photoUrl,
    college: $college,
    location: $location,
    phone: $phone
  })
}

mutation UpsertUserProfile($displayName: String!, $email: String!, $role: UserRole!, $photoUrl: String, $college: String, $location: String, $phone: String)
  @auth(expr: "auth.token.userRole == vars.role") {
  user_upsert(data: {
    uid_expr: "auth.uid",
    displayName: $displayName,
    email: $email,
    role: $role,
    photoUrl: $photoUrl,
    college: $college,
    location: $location,
    phone: $phone
  })
}

mutation UpsertCompany($name: String!, $type: String, $industry: String, $location: String, $coordinates: Any, $employees: String, $founded: Int, $website: String, $tagline: String, $about: String, $mission: String, $techStack: [String!], $departments: [String!], $hiringDomains: [String!], $benefits: [String!], $culture: [String!], $logo: String, $coverImage: String)
  @auth(expr: "auth.token.userRole == 'INDUSTRY'") {
  company_insert(data: {
    ownerUid_expr: "auth.uid",
    name: $name,
    type: $type,
    industry: $industry,
    location: $location,
    coordinates: $coordinates,
    employees: $employees,
    founded: $founded,
    website: $website,
    tagline: $tagline,
    about: $about,
    mission: $mission,
    techStack: $techStack,
    departments: $departments,
    hiringDomains: $hiringDomains,
    benefits: $benefits,
    culture: $culture,
    logo: $logo,
    coverImage: $coverImage
  })
}

mutation UpdateMyCompany($id: UUID!, $name: String!, $industry: String, $employees: String, $location: String, $website: String, $about: String, $mission: String)
  @auth(expr: "auth.token.userRole == 'INDUSTRY'") {
  company_update(first: { where: { id: { eq: $id }, ownerUid: { eq_expr: "auth.uid" } } }, data: {
    name: $name,
    industry: $industry,
    employees: $employees,
    location: $location,
    website: $website,
    about: $about,
    mission: $mission
  })
}

