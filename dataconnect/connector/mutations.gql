mutation CreateApplication($companyId: UUID!, $opportunityId: UUID!, $opportunityType: String!, $jobId: String, $internshipId: String, $opportunityKey: String, $title: String!, $jobType: String!, $matchScore: Int, $matchedSkills: [String!], $missingSkills: [String!])
  @auth(expr: "auth.token.email_verified && auth.token.userRole == 'STUDENT' && vars.opportunityType in ['job', 'internship']") @transaction {
  query @redact {
    company(id: $companyId)
      @check(expr: "this != null && ((vars.opportunityType == 'job' && this.ownedJob.size() == 1) || (vars.opportunityType == 'internship' && this.ownedInternship.size() == 1))", message: "Opportunity does not belong to this company") {
      ownedJob: jobs_on_company(where: { id: { eq: $opportunityId } }, limit: 1) { id }
      ownedInternship: internships_on_company(where: { id: { eq: $opportunityId } }, limit: 1) { id }
    }
  }
  application_insert(data: {
    candidateUid_expr: "auth.uid",
    opportunityKey: $opportunityKey,
    companyId: $companyId,
    jobId: $jobId,
    internshipId: $internshipId,
    title: $title,
    jobType: $jobType,
    matchScore: $matchScore,
    matchedSkills: $matchedSkills,
    missingSkills: $missingSkills
  })
}

mutation UpdateApplicationStage($id: UUID!, $stage: ApplicationStage!, $note: String)
  @auth(expr: "auth.token.userRole == 'INDUSTRY'") @transaction {
  query @redact {
    application(id: $id) @check(expr: "this != null", message: "Application access denied") {
      company { ownerUid @check(expr: "this == auth.uid", message: "Application access denied") }
    }
  }
  application_update(id: $id, data: {
    stage: $stage,
    recruiterNotes: $note,
    updatedAt_expr: "request.time"
  })
}

